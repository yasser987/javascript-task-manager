<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive JavaScript task manager with persistent local storage.">
  <link rel="stylesheet" href="style.css">
  <title>Task Manager | JavaScript Project</title>
</head>
<body>
  <main class="app">
    <header class="app__header">
      <p class="eyebrow">Stay focused</p>
      <h1>Task Manager</h1>
      <p class="intro">Plan your day, track progress, and keep every task available between visits.</p>
      <form class="task-form" novalidate>
        <label class="sr-only" for="task-input">New task</label>
        <input id="task-input" class="task-input" type="text" placeholder="What needs to be done?" maxlength="120" autocomplete="off" required>
        <button class="add-button" type="submit">Add task</button>
      </form>
      <p class="form-message" role="status" aria-live="polite"></p>
    </header>
    <section class="task-panel" aria-labelledby="tasks-title">
      <div class="task-panel__heading">
        <h2 id="tasks-title">Your tasks</h2>
        <span class="task-count" aria-live="polite">0 tasks</span>
      </div>
      <ul class="task-list"></ul>
      <p class="empty-state">No tasks yet. Add your first task above.</p>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
